<!DOCTYPE html>
<!--
  ============================================================
   安陵図書館  資料一覧（shiryou.html）
  ============================================================
   ■ 文字を変えたいとき
     「✏」マークのコメントがある場所が、書き換えるところです。

   ■ 関係するファイル
     base.css … 全ページ共通の見た目
     shiryou.css … このページだけの見た目
     site.js  … 文字サイズ切替など
  ============================================================
-->
<html lang="ja">

<head>
  <meta charset="utf-8">

  <!-- ✏ ブラウザのタブに出るタイトル -->
  <title>資料一覧｜安陵図書館</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b2622">

  <!-- フォント（Google Fonts） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- 見た目（CSS） -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="shiryou.css">
</head>

<body>
  <a id="top"></a>

  <!-- キーボード操作の人向け：Tabキーで最初に出る「本文へスキップ」 -->
  <a class="skip" href="#main">本文へスキップ</a>


  <!-- ==========================================================
       ヘッダー（ロゴ・メニュー・文字サイズ）
       ========================================================== -->
  <header class="site-header">

    <!-- ロゴ（押すとトップページへ） -->
    <a href="index.html" class="brand">
      <img src="img/logo.png" alt="" class="brand-logo">
      <span class="brand-name">安陵図書館<small>ANRYO LIBRARY</small></span>
    </a>

    <nav class="gnav">
      <a class="btn" href="index.html">トップへ</a>
    </nav>

    <!-- 文字サイズ切替（動きは site.js） -->
    <div class="tools">
      <div class="fs" role="group" aria-label="文字サイズ">
        <span class="fs-label" aria-hidden="true">文字</span>
        <button type="button" class="fs-btn" data-fs="m" aria-pressed="true">標準</button>
        <button type="button" class="fs-btn" data-fs="l" aria-pressed="false">大</button>
      </div>
    </div>

  </header>


  <!-- ==========================================================
       ページのタイトル
       ✏ パンくず（トップ ／ …）・タイトル・説明文
       ========================================================== -->
  <section class="page-head">
    <div class="inner">
      <p class="crumb"><a class="ul" href="index.html">トップ</a> ／ 資料一覧</p>
      <h2>【資料一覧】</h2>
    </div>
  </section>


  <!-- ==========================================================
       本文
       ========================================================== -->
  <main class="page-main" id="main" tabindex="-1">

    <!-- ✏ 一覧
         1つの <nav>～</nav> が1項目。ttl がタイトル、desc が説明、href="" がリンク先。
         項目を増やすときは <nav>～</nav> をまるごとコピーしてください。 -->
    <section class="panel">
      <div class="itiran">

        <nav><a href="mokuroku.html">
          <span class="ttl">『奄美民俗』目録一覧</span>
          <span class="desc">鹿児島県立大島高等学校 郷土研究クラブ 編纂</span>
          <i class="arw" aria-hidden="true"></i>
        </a></nav>

        <nav><a href="oshirase.html">
          <span class="ttl">図書だよりアーカイブ</span>
          <span class="desc">これまでに発行した図書だより</span>
          <i class="arw" aria-hidden="true"></i>
        </a></nav>

        <nav><a href="soon.html">
          <span class="ttl">～COMING SOON～</span>
          <span class="desc">準備中です</span>
          <i class="arw" aria-hidden="true"></i>
        </a></nav>

      </div>
    </section>
  </main>


  <!-- ==========================================================
       フッター
       ========================================================== -->
  <footer class="site-footer">
    <div class="kasuri-band" aria-hidden="true"></div>
    <p>© 2026 Anryo Library</p>
  </footer>

  <!-- 右下：トップに戻るボタン -->
  <a href="#top" class="back-to-top" aria-label="トップに戻る">▲</a>

  <script src="site.js"></script>
</body>

</html>
